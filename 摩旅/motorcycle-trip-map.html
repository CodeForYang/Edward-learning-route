// ==================== RENDER SIDEBAR FIRST ====================
function buildList(){
  var h='';
  PH.forEach(function(ph){
    h+='<div class="phase-bar" style="background:'+ph.color+'" onclick="flyToPhase('+ph.id+')">'+ph.icon+' '+ph.name+'</div>';
    DAYS.filter(function(dd){return dd.d>=ph.days[0]&&dd.d<=ph.days[1];}).forEach(function(dd){
      var tc=dd.t==='rest'?'tag-rest':'tag-ride';
      var camp=dd.tag.indexOf('🏕️')>=0?'<span class="tag tag-camp">🏕️</span>':'';
      var det=dd.tag.indexOf('🔄')>=0?'<span class="tag tag-detour">绕行</span>':'';
      var cleanTag=dd.tag.replace(' 🔄','').replace(' 🏕️','');
      h+='<div class="day-row" onclick="selectCity(\''+dd.city+'\','+dd.lat+','+dd.lng+')" id="row-'+dd.d+'">';
      h+='<span class="day-num" style="background:'+ph.color+'">D'+dd.d+'</span>';
      h+='<span class="day-info"><span class="day-city">'+dd.city+'</span>';
      h+='<span class="day-meta">'+dd.route+' · '+dd.km+'km <span class="tag '+tc+'">'+cleanTag+'</span>'+camp+det+'</span></span>';
      h+='</div>';
    });
  });
  document.getElementById('listContent').innerHTML=h;
}
buildList();

// ==================== MAP INIT ====================
var map = null;
var mapTries = 0;

function tryInitMap(){
  if (typeof L === 'undefined') {
    mapTries++;
    if (mapTries < 40) { setTimeout(tryInitMap, 300); }
    else { document.getElementById('map').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666;text-align:center;padding:40px">🗺️ 地图 CDN 加载超时<br><span style="font-size:0.7em">请检查网络后刷新页面<br>行程列表仍可正常使用</span></div>'; }
    return;
  }
  try {
    map = L.map('map', { zoomControl: true }).setView([42.5, 112], 5);

    // Multiple tile sources with automatic fallback (ordered by reliability in China)
    var tileUrls = [
      { name:'CartoDB', url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', attr:'&copy; OSM &copy; CARTO' },
      { name:'OSM',     url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr:'&copy; OSM' },
      { name:'OSM Hot', url:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', attr:'&copy; OSM France' },
    ];

    var tileIndex = 0;
    var tileLayer = L.tileLayer(tileUrls[0].url, {
      attribution: tileUrls[0].attr, maxZoom: 13
    });

    tileLayer.on('tileerror', function() {
      tileIndex++;
      if (tileIndex < tileUrls.length) {
        console.log('Tile source failed, trying: ' + tileUrls[tileIndex].name);
        tileLayer.setUrl(tileUrls[tileIndex].url);
        map.attributionControl.setPrefix(tileUrls[tileIndex].attr);
      } else {
        // All tile sources failed — routes and markers still visible on plain background
        document.getElementById('map').style.background = '#1a1a2e';
        console.log('All tile sources failed. Map markers and routes are still visible.');
      }
    });
    tileLayer.addTo(map);

    // Route polylines
    var ROUTES = [
      { p:1, c:[[36.0611,103.8343],[35.5,103.5],[34.9834,102.9113]] },               // 兰州→合作
      { p:1, c:[[34.9834,102.9113],[34.6,103.2],[34.9834,102.9113]] },               // 洛克之路往返
      { p:1, c:[[34.9834,102.9113],[36.0,104.5],[37.5136,105.1884]] },               // 合作→中卫
      { p:1, c:[[37.5136,105.1884],[38.0,105.7],[38.43,105.99],[38.4872,106.2309]] }, // 中卫→西夏王陵→银川
      { p:2, c:[[38.4872,106.2309],[39.2333,106.7667],[39.6083,109.7813]] },          // 银川→鄂尔多斯
      { p:2, c:[[39.6083,109.7813],[39.6833,110.8667],[40.8424,111.7490]] },          // 鄂尔多斯→呼和浩特
      { p:3, c:[[40.8424,111.7490],[40.25,112.0],[40.0768,113.3001]] },              // 呼和浩特→大同
      { p:3, c:[[40.0768,113.3001],[39.9,113.5],[39.56,113.19]] },                    // 大同→应县
      { p:3, c:[[39.56,113.19],[40.3,114.5],[40.9746,115.2816]] },                    // 应县→张家口
      { p:4, c:[[40.9746,115.2816],[41.4,115.3],[42.35,116.15],[41.8773,115.2841]] }, // 张家口→太仆寺
      { p:4, c:[[41.8773,115.2841],[42.8,115.7],[43.9441,116.0866]] },               // 太仆寺→锡林浩特
      { p:4, c:[[43.9441,116.0866],[44.5833,117.6],[45.5230,116.9721]] },             // 锡林浩特→东乌旗
      { p:4, c:[[45.5230,116.9721],[46.85,119.2],[47.1775,119.9435]] },               // 东乌旗→阿尔山
      { p:5, c:[[47.1775,119.9435],[48.45,119.8],[48.1,119.7833],[49.2130,119.7643]] },
      { p:5, c:[[49.2130,119.7643],[49.4,118.6],[49.5976,117.3771]] },
      { p:5, c:[[49.5976,117.3771],[50.1,119.45],[50.0,119.5],[50.78,121.52]] },
      { p:6, c:[[50.78,121.52],[50.65,123.6],[50.55,123.85],[50.42,124.12]] },
      { p:6, c:[[50.42,124.12],[49.75,124.6],[49.1857,125.22]] },
      { p:6, c:[[49.1857,125.22],[49.7,126.3],[50.25,127.48]] },
      { p:7, c:[[50.25,127.48],[48.7,126.1],[48.2416,126.5197]] },
      { p:7, c:[[48.2416,126.5197],[46.6333,126.9833],[45.8038,126.5350]] },
    ];
    ROUTES.forEach(function(r){
      var ph=PH.find(function(p){return p.id===r.p;});
      L.polyline(r.c,{color:ph.color,weight:4,opacity:0.7}).addTo(map);
    });

    // Detour dashed lines
    [{f:[45.523,116.972],t:[46.85,119.2]},{f:[50.78,121.52],t:[50.65,123.6]},{f:[48.242,126.52],t:[48.7,126.1]}].forEach(function(d){
      L.polyline([d.f,d.t],{color:'#f39c12',weight:2,dashArray:'6 6',opacity:0.5}).addTo(map);
    });

    // City markers
    var seen={};
    DAYS.forEach(function(d){
      if(seen[d.city])return; seen[d.city]=true;
      var ph=PH.find(function(p){return d.d>=p.days[0]&&d.d<=p.days[1];});
      var isRest=d.t==='rest';
      var m=L.circleMarker([d.lat,d.lng],{radius:isRest?8:5,fillColor:ph.color,color:'#fff',weight:2,fillOpacity:0.9}).addTo(map);
      var daysHere=DAYS.filter(function(dd){return dd.city===d.city;});
      var pop='<b style="color:'+ph.color+'">'+d.city+'</b>';
      daysHere.forEach(function(cd){pop+='<br>Day '+cd.d+' · '+cd.route+' · '+cd.km+'km';});
      m.bindPopup(pop,{maxWidth:240});
      m.on('click',function(){selectCity(d.city,d.lat,d.lng);});
    });

    // Side trip markers
    SIDES.forEach(function(s){
      var icon=L.divIcon({className:'',html:'<div style="background:'+(s.type==='detour'?'#f39c12':'#3498db')+';color:#fff;width:16px;height:16px;border-radius:'+(s.type==='detour'?'3px':'50%')+';text-align:center;line-height:16px;font-size:10px;border:1px solid #fff;transform:rotate('+(s.type==='detour'?'45deg':'0deg')+')">'+(s.type==='detour'?'&#9671;':'·')+'</div>',iconSize:[16,16],iconAnchor:[8,8]});
      var m=L.marker([s.lat,s.lng],{icon:icon}).addTo(map);
      m.bindPopup('<b>'+s.name+'</b><br><span style="font-size:0.78em;color:#aaa">'+s.desc.substring(0,100)+'...</span>',{maxWidth:240});
    });

    // Legend
    var legend = L.control({position:'bottomleft'});
    legend.onAdd = function(){
      var d=document.createElement('div'); d.className='legend';
      d.innerHTML=PH.map(function(p){return '<div class="legend-item"><i style="background:'+p.color+'"></i>'+p.name+'</div>';}).join('')+
        '<div style="margin-top:6px;font-size:0.65em;color:#555">⬤ 休整/深度游 &nbsp; ○ 骑行过夜 &nbsp; <span style="color:#f39c12">◇</span> 绕行推荐 &nbsp; <span style="color:#3498db">·</span> 沿途可见</div>';
      return d;
    };
    legend.addTo(map);

    map.fitBounds(DAYS.map(function(d){return [d.lat,d.lng];}),{padding:[30,30]});
  } catch(e) {
    document.getElementById('map').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;text-align:center;padding:40px">🗺️ 地图渲染失败<br><span style="font-size:0.7em">'+e.message+'</span></div>';
  }
}
tryInitMap();

// ==================== INTERACTION ====================
function selectCity(city,lat,lng){
  document.querySelectorAll('.day-row').forEach(function(r){r.classList.remove('sel');});
  var fd=DAYS.find(function(d){return d.city===city;});
  if(fd){var row=document.getElementById('row-'+fd.d);if(row)row.classList.add('sel');}
  if(map){try{map.flyTo([lat,lng],10,{duration:0.6});}catch(e){}}

  var cd=CITY[city];if(!cd)return;
  var ph=PH.find(function(p){return fd&&fd.d>=p.days[0]&&fd.d<=p.days[1];});
  var daysHere=DAYS.filter(function(d){return d.city===city;});

  var h='<div class="card"><h3>'+city+'</h3><div class="emoji-hero">'+cd.hero+'</div>';
  h+='<p class="desc"><strong style="color:#fff">'+cd.desc+'</strong></p>';
  h+='<p style="font-size:0.72em;color:#555;margin-top:3px">'+daysHere.map(function(d){return 'Day '+d.d;}).join(' / ')+'</p></div>';

  // Road
  h+='<div class="card"><div class="sec"><h4>🛣️ 骑行路书</h4>';
  h+='<p><strong>出发：</strong>'+cd.road.from+'</p>';
  h+='<div class="route-code">'+cd.road.via+'</div>';
  h+='<p style="margin-top:4px"><strong>路面：</strong>'+cd.road.surface+'<br><strong>加油：</strong>'+cd.road.gas+'</p>';
  if(cd.road.note)h+='<div class="warn">💡 '+cd.road.note+'</div>';
  h+='</div></div>';

  // Stay
  h+='<div class="card"><div class="sec"><h4>🏨 住宿</h4><ul>';
  cd.stay.forEach(function(s){h+='<li><strong>'+s.name+'</strong> <span style="color:#555;font-size:0.72em">'+s.price+'</span><br><span style="color:#888">'+s.why+'</span></li>';});
  h+='</ul></div></div>';

  // Along
  h+='<div class="card"><div class="sec"><h4>📍 本站及沿途</h4>';
  cd.along.forEach(function(a){
    h+='<div class="along-item"><span class="along-badge '+a.cls+'">'+a.badge+'</span><span class="along-text">'+a.text+'</span></div>';
  });
  h+='</div></div>';

  // Food
  h+='<div class="card"><div class="sec"><h4>🍜 食</h4><ul>';
  cd.food.forEach(function(f){h+='<li>'+f+'</li>';});
  h+='</ul></div></div>';

  // Warn
  if(cd.warn)h+='<div class="card"><div class="warn" style="font-size:0.82em">⚠️ '+cd.warn+'</div></div>';

  document.getElementById('detailContent').innerHTML=h;
  switchTab('detail');
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.tab-content').forEach(function(x){x.classList.remove('active');});
  if(t==='list'){
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('listContent').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('detailContent').classList.add('active');
  }
}

function flyToPhase(id){
  if(!map)return;
  var ds=DAYS.filter(function(d){return d.d>=PH.find(function(p){return p.id===id;}).days[0]&&d.d<=PH.find(function(p){return p.id===id;}).days[1];});
  var lats=ds.map(function(d){return d.lat;}),lngs=ds.map(function(d){return d.lng;});
  try{map.flyTo([(Math.min.apply(null,lats)+Math.max.apply(null,lats))/2,(Math.min.apply(null,lngs)+Math.max.apply(null,lngs))/2],7,{duration:0.6});}catch(e){}
}
